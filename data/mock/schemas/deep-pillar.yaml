# 深柱 schema · 11 类信号字段定义
# ---
# 消费入口：data/mock/deep-pillar/<company_id>/ （Batch 2 后）
# 当前 Batch 1 范围：仅产 shortlist.md + pit-template.md + 15 份空埋坑
# Batch 2 触发：PM 填完 15 份 pits/<cid>.md 回传后才启动完整材料包
# 对齐：data/mock/README.md + onboarding-phase-1 §Task C
# ---
metadata:
  schema_name: deep-pillar
  schema_version: "1.0"
  first_released: "2026-04-24"
  maintainer: data-foundation-worker
  consumer_agents:
    - agent3-credit    # 四维评分
    - agent6-report    # 11 信号消费
    - agent2-riskctrl  # 策略样本源
  phase_gate:
    batch_1_output:
      - shortlist.md
      - pit-template.md
      - pits/*.md (15 份空表)
    batch_2_output:
      - per company_id · 11 类信号完整材料包（MVP 3 家先行）

signal_categories:

  - category_id: enterprise_info
    display_name: 工商基础
    required_fields:
      - 统一社会信用代码（脱敏 4 段）
      - 法人姓名（脱敏：姓+*）
      - 股东结构（至少 3 层，若有控股关系）
      - 经营范围原文（脱敏）
      - 分支机构列表
      - 变更记录（3 年）
    format_hint: json / markdown table
    source_anchor_example: "天眼查/企查查对应 snapshot 脱敏"

  - category_id: financial_3y
    display_name: 3 年财务报表
    required_fields:
      - 资产负债表（3 年对比）
      - 利润表（3 年对比）
      - 现金流量表（3 年对比）
      - 审计报告摘要（含保留意见标记 若有）
    format_hint: xlsx + 配套 yaml 摘要
    source_anchor_example: "A股某上市公司 2021-2023 年报"
    hard_constraint:
      - 所有比率（流动比率/资产负债率/应收周转）不准 LLM 算，由 financial_analyzer.py 消费时计算
      - 脱敏原则：量级保留，数值浮动 ±30%，年份错位 ±2 年

  - category_id: bank_flow_12m
    display_name: 12 个月银行流水
    required_fields:
      - 对公账户流水（日粒度或月粒度）
      - 交易对手 top 20（脱敏名称）
      - 大额异常交易标记
      - 季节性特征摘要
    format_hint: csv / jsonl
    source_anchor_example: "央行对公流水模板 §X.Y"

  - category_id: credit_report
    display_name: 人行征信
    required_fields:
      - 基本信息段
      - 信贷交易明细（5 年）
      - 公共信息明细（税务/欠税/被执行）
      - 查询记录明细
      - 信贷余额/逾期摘要
    format_hint: markdown 仿真
    source_anchor_example: "央行企业征信模板 2023 版"
    hard_constraint:
      - 五级分类必须齐全（正常/关注/次级/可疑/损失）
      - 若有逾期必须与 bank_flow_12m 可交叉验证（或明确埋冲突坑）

  - category_id: guarantee
    display_name: 担保信息
    required_fields:
      - 对外担保（保证/抵押/质押分列）
      - 关联方担保
      - 反担保链
      - 担保额度与在贷余额
    format_hint: markdown table
    source_anchor_example: "A股年报 §担保情况专节"

  - category_id: contracts
    display_name: 重大合同
    required_fields:
      - 采购合同摘要（top 10 上游）
      - 销售合同摘要（top 10 下游）
      - 合同金额与履约状态
      - 异常合同标记（超长账期/关联方/明显偏离市价）
    format_hint: markdown / xlsx
    source_anchor_example: "A股年报 §重大经营合同"

  - category_id: public_opinion
    display_name: 舆情（深层）
    required_fields:
      - 新闻聚合（至少 12 条 · 含正/中/负比例）
      - 诉讼公告
      - 行政处罚
      - 社交媒体敏感话题（脱敏）
    format_hint: jsonl
    source_anchor_example: "裁判文书网/信用中国脱敏抓取"

  - category_id: policy_link
    display_name: 政策关联
    required_fields:
      - 产业政策匹配（国家/地方）
      - 行业监管新规命中
      - 补贴记录（若有）
      - 重大政策风险暴露点
    format_hint: markdown
    source_anchor_example: "发改委/工信部/银保监 2023-2025 政策库"

  - category_id: post_loan_behavior
    display_name: 贷后行为
    required_fields:
      - 用信记录（历史授信使用）
      - 还款表现（逾期次数/最长逾期）
      - 客户经理走访纪要摘要（脱敏）
      - 贷后预警历史
    format_hint: markdown / timeline
    source_anchor_example: "银行内部贷后模板脱敏"

  - category_id: risk_flags
    display_name: 风险标记
    required_fields:
      - 红线命中（CLAUDE.md §8 QC 红线项）
      - 黄线命中
      - 特殊风险标签（如"虚假授信"/"壳公司"/"实际控制人失联"）
      - 埋坑映射（由 pits/<cid>.md 填完后生成）
    format_hint: yaml
    source_anchor_example: "银保监处罚公告虚构改写"

  - category_id: strategy_sample_meta
    display_name: 策略样本元数据
    required_fields:
      - sample_id
      - expected_decision（通过/拒绝/待补材料）
      - expected_red_lines
      - expected_score_range
      - evaluator_notes（PM 填）
    format_hint: yaml
    source_anchor_example: "内部审贷会纪要脱敏"
    usage:
      - Agent2 DSL 回测消费
      - 评估 runner 的 ground truth 锚定
      - 不进 LLM prompt（QC scorer only，对齐 §3.1）

difficulty_distribution:
  easy: 3
  medium: 7
  medium_alt: 8       # 容差：medium 可取 7 或 8
  hard: 3
  extreme: 2
  extreme_alt: 1      # 容差：extreme 可取 1 或 2（总和 = 15）
  must_include:
    - 至少 1 家"虚假授信"极端样本（参考银保监处罚公告）
    - 至少 1 家制造业简单档（作正向对照）
    - 至少 1 家地产关联困难档（压力测试）

validation_rules:
  - rule: shortlist.md 的 15 家 company_id 必须全部出自 wide-base/companies.yaml 且 deep_pillar_candidate=true
  - rule: 每家 pits/<cid>.md 文件名必须精确匹配宽基 company_id
  - rule: Batch 1 阶段 deep-pillar/<cid>/ 下禁止出现除 pits/ 外的任何子目录
  - rule: Batch 2 启动必须检查 15 份 pits/*.md 均含 PM 签字 + 回传日期
