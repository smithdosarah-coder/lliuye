# 宽基 schema · Agent1 检索池 / Agent4 批量扫描 / Agent5 合规矩阵目标池
# ---
# 消费入口：data/mock/wide-base/companies.yaml
# 规模约束：100 家，8 大行业分布，4 档难度严格 20/50/20/10
# 对齐：data/mock/README.md § "字段类型约定"
# ---
metadata:
  schema_name: wide-base
  schema_version: "1.0"
  first_released: "2026-04-24"
  maintainer: data-foundation-worker
  consumer_agents:
    - agent1-channel
    - agent4-alert
    - agent5-compliance

distribution_constraints:
  industry_l1:
    制造业: 25
    零售商贸: 20
    服务业: 15
    地产关联: 10
    农业: 8
    科技: 12
    跨境外贸: 5
    集团对私: 5
  difficulty:
    easy: 20
    medium: 50
    hard: 20
    extreme: 10
  # 注：资质真实分布（非硬分布约束，但抽检基准）
  qualification_realism_baseline:
    国家高新技术企业_pct: 15
    专精特新_pct: 5
    无特殊资质_pct: 80

fields:
  - name: company_id
    type: string
    pattern: "^WB[0-9]{3}$"
    required: true
    description: "宽基唯一标识，格式 WB001 ~ WB100"

  - name: name
    type: string
    required: true
    min_length: 4
    max_length: 40
    description: "企业名称，脱敏再造（不可与真实企业同名）"

  - name: industry_l1
    type: enum
    required: true
    values: [制造业, 零售商贸, 服务业, 地产关联, 农业, 科技, 跨境外贸, 集团对私]
    description: "一级行业分类"

  - name: industry_l2
    type: string
    required: true
    description: "二级细分（如 制造业→精密机械加工 / 零售商贸→家电连锁）"

  - name: region
    type: string
    required: true
    pattern: "^[\\u4e00-\\u9fa5]+-[\\u4e00-\\u9fa5]+-[\\u4e00-\\u9fa5]+$"
    description: "地域 省-市-区 格式，如 浙江省-杭州市-滨江区；门牌脱敏"

  - name: size
    type: enum
    required: true
    values: [micro, small, medium, large, group]
    description: "企业规模（工信部 2011 划型标准近似）"

  - name: listed_bool
    type: boolean
    required: true
    description: "是否上市（A 股/港股/美股）"

  - name: listed_info
    type: object
    required: false
    description: "上市详情，listed_bool=true 时填"
    subfields:
      - name: market
        type: enum
        values: [SH, SZ, HK, US, BJ]
      - name: ticker_masked
        type: string
        description: "脱敏代码，如 A股600XXX（中间 3 位打码）"

  - name: registered_capital
    type: string
    pattern: "^[0-9]+(\\.[0-9]+)?万元$"
    required: true
    description: "注册资本，量级保留、数值脱敏后浮动 ±30%"

  - name: establish_year
    type: integer
    required: true
    min: 1990
    max: 2025
    description: "成立年份（标杆年份 ±2 年）"

  - name: brief_profile
    type: string
    required: true
    min_length: 40
    max_length: 180
    description: "主营业务一句话摘要（40-180 字）"

  - name: public_opinion_shallow
    type: list
    required: true
    min_items: 2
    max_items: 3
    description: "浅层舆情信号 2-3 条（每条 <60 字）"
    item_schema:
      - name: signal_type
        type: enum
        values: [正面, 中性, 负面]
      - name: title
        type: string
        max_length: 60
      - name: date
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      - name: source_hint
        type: string
        description: "来源提示，如 地方日报 / 行业媒体 / 监管公告（脱敏）"

  - name: difficulty
    type: enum
    required: true
    values: [easy, medium, hard, extreme]
    description: "难度档（盲测法基础），严格分布 20/50/20/10"

  - name: benchmark_ref
    type: string
    required: true
    min_length: 10
    description: "脱敏前身的标杆锚点，例：A股600XXX 2023年报 主业/应收账款章节 / 央行征信模板 §3.2 / 银保监2023年XX号处罚"

  - name: tags
    type: list
    required: false
    description: "业务标签（自由） 如 出口导向 / 区域龙头 / 产能扩张中 / 融资瓶颈"

  - name: deep_pillar_candidate
    type: boolean
    required: true
    default: false
    description: "是否被选入深柱 15 家候选（由 shortlist.md 定）"

validation_rules:
  - rule: 所有企业 difficulty 枚举和必须 easy=20 medium=50 hard=20 extreme=10
  - rule: 所有企业 industry_l1 枚举和必须与 distribution_constraints.industry_l1 完全一致
  - rule: 若 listed_bool=true 则 listed_info 必须存在
  - rule: benchmark_ref 不可为空或占位；缺失标注 "未能自动填写" 并列为反工项
  - rule: public_opinion_shallow 每条 title 长度 <60 字符；source_hint 不得直写真实媒体名（如 "人民日报"→"央媒 A"）
