name: Daily Visual + Admin E2E (B.3.4 + B.4 SLO-2 · e2e-daily)

# B.3.4 修正版 5f3d2ec (2026-05-11 06:30 KT R5) + B.4 SLO-2 reframe (2026-05-11 12:55 GO).
#
# 2 jobs · 独立 gate · 独立 Issue:
#   1. daily-visual: 6 助手 idle 视觉基线 (本地 dev server pixel diff)
#      - flag: vars.DAILY_VISUAL_ENABLED (= 'true' 才跑 schedule)
#   2. admin-e2e: 真后端 admin 真号 E2E · 双轨 (mock 演示 + 实时搜索) verification
#      - flag: vars.ADMIN_E2E_ENABLED (= 'true' 才跑 schedule) · 需 secrets.ADMIN_COOKIE
#      - B.4 SLO-2 4 主活全 cover (见 docs/contracts/e2e-slo-2-contract.md):
#         · D 6 demo spec  (admin-{agent}.spec.ts × 6 · B.3.4)
#         · A 6 realtime spec (admin-{agent}-realtime.spec.ts × 6 · B.4)
#         · B replay 一致性 (admin-replay-consistency.spec.ts · 6 sub-test serial · B.4)
#         · C 双轨并发 (admin-dual-track-concurrency.spec.ts · 2 sub-test · B.4)
#      - glob admin-*.spec.ts 自动 cover 全 14 spec · 总 ~12min · timeout 25min 余量充足
#
# 触发 (3 条 · 2 job 共用):
#   1. cron 22:00 UTC = 06:00 Asia/Shanghai · PM 起床前自检
#   2. workflow_dispatch · 手动触发 (调试 / baseline 重建)
#   3. push 到 feat/b34-e2e-daily · 让 worker 自己也能验
#
# 行为:
#   - 跑 daily-visual.spec.ts (6 助手 idle 视觉基线 + alert idle TDD red 锚点)
#   - 跑 6 admin-*.spec.ts (真 prod backend · admin 真号 cookie)
#   - 跑 scripts/e2e/run_admin_daily.sh (bash 探针 SSE done ≤ 60s)
#   - fail 时: 自动开 GitHub Issue + 上传 artifact (per job 独立 Issue 文案)
#
# Baseline 管理 (仅 daily-visual job):
#   - 首次跑时 baseline 不存在 · Playwright 自动创建并 fail
#   - workflow_dispatch update_baseline=true 重建
#
# 不要把这跟 web-audit.yml (4-gate spec · 阻 PR merge) 混 · 本 workflow 是
# **每日运行型监控** · 不阻 PR · 失败开 Issue 通知人.

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai (UTC+8)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: '更新 baseline (传 true 让 Playwright --update-snapshots)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - feat/b34-e2e-daily
      - main
    paths:
      - 'web/tests/regression/daily-visual.spec.ts'
      - 'web/tests/regression/daily-visual.spec.ts-snapshots/**'
      - '.github/workflows/daily-visual.yml'

concurrency:
  group: daily-visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-visual:
    name: Daily Visual Regression (chromium hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Feature flag (per baseline-gate.yml 同款模式 · 2026-05-11 PM 反馈加):
    #   - workflow_dispatch: 永远允许 (留手动通道做 baseline 创建 / 调试)
    #   - schedule + push: 等 vars.DAILY_VISUAL_ENABLED=true 才跑
    # PM enable 流程: fix-indep 主活 B 完 + baseline snapshots 已 commit 后 ·
    # 显式 set repo variable DAILY_VISUAL_ENABLED=true · 见 docs/runbook/daily-visual.md §2.1
    if: |
      github.event_name == 'workflow_dispatch' ||
      vars.DAILY_VISUAL_ENABLED == 'true'
    defaults:
      run:
        working-directory: web
    permissions:
      contents: read
      issues: write   # 失败时开 Issue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run daily-visual spec
        id: run_spec
        env:
          # 防系统代理劫持 127.0.0.1:3101 health-check (per web-audit.yml)
          NO_PROXY: '127.0.0.1,localhost,::1'
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          ALL_PROXY: ''
          UPDATE_BASELINE: ${{ github.event.inputs.update_baseline }}
        run: |
          if [ "$UPDATE_BASELINE" = "true" ]; then
            echo "::notice::baseline 更新模式 · 用 --update-snapshots"
            npx playwright test tests/regression/daily-visual.spec.ts \
              --project=chromium --update-snapshots
          else
            npx playwright test tests/regression/daily-visual.spec.ts \
              --project=chromium
          fi

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-visual-report-${{ github.run_id }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

      - name: Upload baseline snapshots (always · 方便人工 commit baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-visual-snapshots-${{ github.run_id }}
          path: web/tests/regression/daily-visual.spec.ts-snapshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Ensure labels exist (idempotent · fault-tolerant)
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          # gh label create --force = create or update · 重复跑无害
          # || true 防 permission denied / API 500 拖垮 issue 步
          gh label create daily-visual \
            --repo "${REPO}" \
            --color FBCA04 \
            --description "Daily visual regression alert" \
            --force || true
          gh label create regression \
            --repo "${REPO}" \
            --color D93F0B \
            --description "Regression" \
            --force || true

      - name: Open GitHub Issue on failure (only on schedule)
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        working-directory: ${{ github.workspace }}
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TITLE="[daily-visual] 视觉回归 fail · ${DATE} 06:00 CST"

          # heredoc with column-0 EOF · expansion ON · Markdown indented at column 0
          BODY=$(cat <<EOF
          ## Daily visual regression 失败

          - **触发**: cron schedule (06:00 Asia/Shanghai · ${DATE})
          - **commit**: ${COMMIT_SHA}
          - **branch**: ${REF_NAME}
          - **run URL**: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}

          ## 下一步

          1. 下载 artifact \`daily-visual-report-${RUN_ID}\` 看 diff 截图
          2. 判断: 真 regression (有 worker 改坏前端) vs 预期变化 (新功能 ship)
          3. 真 regression → 找责任 worker fix-forward
          4. 预期变化 → 触发 \`workflow_dispatch\` 设 \`update_baseline=true\` 重建 baseline · 然后下载 artifact \`daily-visual-snapshots-${RUN_ID}\` 人工 commit 到 \`web/tests/regression/daily-visual.spec.ts-snapshots/\`

          详见 \`docs/runbook/daily-visual.md\`.

          ---
          *Auto-opened by .github/workflows/daily-visual.yml*
          EOF
          )

          # dedupe: 同标题 24h 内已有开放 Issue 就 comment · 不重复开
          EXISTING=$(gh issue list \
            --repo "${REPO}" \
            --label daily-visual \
            --state open \
            --search "${TITLE}" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} 已存在 · 追加 comment"
            gh issue comment "$EXISTING" \
              --repo "${REPO}" \
              --body "重复 fail · run #${RUN_ID} · ${DATE}"
          else
            gh issue create \
              --repo "${REPO}" \
              --title "$TITLE" \
              --body "$BODY" \
              --label daily-visual,regression
          fi

  # ============================================================================
  # admin-e2e job (B.3.4 主活 A + B · 2026-05-11 PM reframe · 真号 production E2E)
  #
  # 跑 6 agent demo/run endpoint 真后端 SSE + 6 admin-*.spec.ts UI E2E.
  # 与 daily-visual job 独立 · 自己 gate flag · 自己开 Issue.
  #
  # 核心区别 (vs daily-visual):
  #   - daily-visual    本地 dev server (npm run dev :3101) · pixel diff
  #   - admin-e2e       真 prod backend (https://liuye.me) · 真 LLM/Tavily 调用 · 真 cookie
  # ============================================================================
  admin-e2e:
    name: Admin 真号 E2E (6 agent demo/run · prod backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' ||
      vars.ADMIN_E2E_ENABLED == 'true'
    permissions:
      contents: read
      issues: write
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://liuye.me' }}
      ADMIN_COOKIE: ${{ secrets.ADMIN_COOKIE }}
      # 显式 PLAYWRIGHT_BASE_URL → playwright.config.ts useWebServer=false ·
      # 不起本地 dev server · 跑真 prod
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://liuye.me' }}
      # ROI #5 (2026-05-21) · E2E 证据链 run_id 全链路传递
      # · bash 探针 (run_admin_daily.sh) + Playwright spec (_shared.ts) 都读这个 env
      # · backend audit_service.middleware 从 X-Liuye-E2E-Run-Id header 解 · 写 e2e_run_id 列
      LIUYE_E2E_RUN_ID: ${{ github.run_id }}
      LIUYE_E2E_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ADMIN_COOKIE present
        run: |
          if [ -z "${ADMIN_COOKIE:-}" ]; then
            echo "::warning::secrets.ADMIN_COOKIE 未配 · spec 自动 skip · bash 探针走 BLOCKED 路径 (exit 2)"
            echo "ADMIN_COOKIE_PRESENT=no" >> "$GITHUB_ENV"
          else
            echo "ADMIN_COOKIE_PRESENT=yes" >> "$GITHUB_ENV"
          fi

      - name: Install jq (bash 探针依赖)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Bash 探针 · 6 agent demo/run SSE
        id: bash_probe
        # 即便 cookie missing 也跑 · 验 BLOCKED 路径 (exit 2 ≠ 0 ≠ 1) 文案稳定
        # cookie missing 时 exit 2 · job conclude failed · 走相同 Issue 路径
        run: bash scripts/e2e/run_admin_daily.sh
        continue-on-error: false

      - name: Setup Node.js (Playwright)
        if: env.ADMIN_COOKIE_PRESENT == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        if: env.ADMIN_COOKIE_PRESENT == 'yes'
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        if: env.ADMIN_COOKIE_PRESENT == 'yes'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run 6 admin-*.spec.ts (UI E2E · prod baseURL)
        if: env.ADMIN_COOKIE_PRESENT == 'yes'
        working-directory: web
        env:
          NO_PROXY: '127.0.0.1,localhost,::1,liuye.me'
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          ALL_PROXY: ''
        run: |
          # --retries=1 容许 prod first-connection warm-up flakiness
          # (实测 worker 2026-05-11: cookie+storageState 双注 · CF 首连 ~3-5s ·
          # 5/6 spec 偶 first-try fail · retry 100% PASS)
          npx playwright test tests/e2e/admin-*.spec.ts \
            --project=chromium \
            --retries=1

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-report-${{ github.run_id }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # ----------------------------------------------------------------------
      # ROI #5 (2026-05-21) · E2E 证据链三件套 - 件 3: audit log export
      #
      # 用 admin cookie 调 /api/audit/by_run_id/{run_id} · 拉 6 agent 真调记录 ·
      # 即使 spec fail 也跑 (if: always) · Issue 评论可显示 backend 真实行为.
      #
      # 失败兜底: backend 5xx / cookie 过期 → 写空 envelope · 不阻断 issue 流程.
      # ----------------------------------------------------------------------
      - name: Export audit log artifact (ROI #5 · 证据链件 3)
        id: export_audit
        if: always()
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL || 'https://liuye.me' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e  # 不让 curl 失败拖垮 workflow · audit export 是辅助产物
          mkdir -p audit-export
          OUT="audit-export/audit-trail-${RUN_ID}.json"

          if [ -z "${ADMIN_COOKIE:-}" ]; then
            echo "::warning::ADMIN_COOKIE 缺 · audit export 跳过 · 写空 envelope"
            cat > "$OUT" <<EOF
          {"run_id":"${RUN_ID}","count":0,"total":0,"agents_hit":[],"endpoints_hit":[],"errors":[],"total_cost_cny":0,"items":[],"limit":5000,"offset":0,"has_more":false,"_note":"ADMIN_COOKIE missing · workflow could not call backend"}
          EOF
          else
            # 兼容用户 paste 完整 'name=value' 或仅 'value'
            COOKIE_VALUE="${ADMIN_COOKIE#zhongan_auth=}"
            HTTP_CODE=$(curl -sS --max-time 30 \
              -H "Cookie: zhongan_auth=${COOKIE_VALUE}" \
              -H "Accept: application/json" \
              "${BASE_URL}/api/audit/by_run_id/${RUN_ID}?limit=5000" \
              -o "$OUT" -w '%{http_code}' || echo "000")
            echo "audit-trail HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::audit export 非 200 (got $HTTP_CODE) · 写 fallback envelope"
              # 用 fallback envelope 覆盖 curl 的 partial body · 防 jq 后面解析炸
              cat > "$OUT" <<EOF
          {"run_id":"${RUN_ID}","count":0,"total":0,"agents_hit":[],"endpoints_hit":[],"errors":[],"total_cost_cny":0,"items":[],"limit":5000,"offset":0,"has_more":false,"_note":"backend returned HTTP ${HTTP_CODE}"}
          EOF
            fi
          fi

          # 解 summary 字段写 GITHUB_OUTPUT (Issue 评论用 · jq 缺时 grep fallback)
          if command -v jq >/dev/null 2>&1; then
            audit_records=$(jq -r '.count // 0' "$OUT")
            agents_hit=$(jq -r '.agents_hit // [] | join(",")' "$OUT")
            error_count=$(jq -r '.errors // [] | length' "$OUT")
            total_cost=$(jq -r '.total_cost_cny // 0' "$OUT")
            has_more=$(jq -r '.has_more // false' "$OUT")
          else
            audit_records=$(grep -oE '"count":[0-9]+' "$OUT" | head -1 | grep -oE '[0-9]+' || echo "0")
            agents_hit=$(grep -oE '"agents_hit":\[[^]]*\]' "$OUT" | head -1 || echo "")
            error_count=0
            total_cost=0
            has_more=false
          fi
          echo "audit_records=${audit_records}" >> "$GITHUB_OUTPUT"
          echo "agents_hit=${agents_hit}" >> "$GITHUB_OUTPUT"
          echo "error_count=${error_count}" >> "$GITHUB_OUTPUT"
          echo "total_cost_cny=${total_cost}" >> "$GITHUB_OUTPUT"
          echo "has_more=${has_more}" >> "$GITHUB_OUTPUT"
          echo "[summary] records=${audit_records} agents=${agents_hit} errors=${error_count} cost_cny=${total_cost} more=${has_more}"

      - name: Upload audit log artifact (ROI #5 · 件 3 持久化)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-trail-${{ github.run_id }}
          path: audit-export/
          retention-days: 30
          if-no-files-found: warn

      - name: Ensure labels exist (fault-tolerant)
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create admin-e2e \
            --repo "${REPO}" \
            --color B60205 \
            --description "Admin 真号 E2E fail (prod backend)" \
            --force || true
          gh label create regression \
            --repo "${REPO}" \
            --color D93F0B \
            --description "Regression" \
            --force || true

      - name: Open GitHub Issue on failure (only on schedule)
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          # ROI #5 · audit summary (from step export_audit)
          AUDIT_RECORDS: ${{ steps.export_audit.outputs.audit_records }}
          AUDIT_AGENTS: ${{ steps.export_audit.outputs.agents_hit }}
          AUDIT_ERRORS: ${{ steps.export_audit.outputs.error_count }}
          AUDIT_COST: ${{ steps.export_audit.outputs.total_cost_cny }}
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TITLE="[admin-e2e] 真号 E2E fail · ${DATE} 06:00 CST"
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          ARTIFACTS_URL="${RUN_URL}#artifacts"

          BODY=$(cat <<EOF
          ## 🔴 Admin 真号 E2E 失败 (prod backend · https://liuye.me)

          ### 证据链 (ROI #5 · 三件套)
          - **件 1 · Cron Run URL**: ${RUN_URL}
          - **件 2 · Playwright Report artifact**: \`admin-e2e-report-${RUN_ID}\` ([下载](${ARTIFACTS_URL}) · 含 screenshot/video/trace)
          - **件 3 · Audit Log artifact**: \`audit-trail-${RUN_ID}\` ([下载](${ARTIFACTS_URL}) · ${AUDIT_RECORDS:-0} records · agents: ${AUDIT_AGENTS:-none} · ${AUDIT_ERRORS:-0} errors · cost ¥${AUDIT_COST:-0})

          ### 基础信息
          - **触发**: cron schedule (06:00 Asia/Shanghai · ${DATE})
          - **commit**: ${COMMIT_SHA}
          - **branch**: ${REF_NAME}

          ## 排查 SOP (三件套联查)

          1. 看 \`admin-e2e-report-${RUN_ID}\` 的 \`playwright-report/index.html\` · 定位哪个 spec fail
          2. 看 \`audit-trail-${RUN_ID}.json\` 的 \`items\` · 按 agent_id grep 对应 spec 的 backend 真实调用 / latency / error
          3. 跨链路对账: spec 看 frontend 期望 · audit log 看 backend 真实行为 · 差异 = bug
          4. 若 audit_records=0 → backend 完全没收到流量 (DNS / CF / nginx 层 fail) · 看 ECS uvicorn log

          ## 可能原因

          1. \`secrets.ADMIN_COOKIE\` 过期 → bash 探针返回 exit 2 (BLOCKED) · PM 重新 paste cookie
          2. prod 后端 5xx / 超时 → 找 ECS uvicorn log + 责任 worker fix-forward
          3. UI selector 漂移 → 6 admin-*.spec.ts 内 selector 与 prod DOM 不匹配 · 调 selector
          4. SSE done 60s 内未到 → 真 LLM 慢 / Tavily 慢 · 调 \`E2E_TIMEOUT_MS\` 或拆任务

          ## 下一步

          1. 责任 worker fix-forward · 改 spec 必带 \`PRESERVES / NEW-DOM / SMOKE-PASS\` trailer
          2. 修绿后此 Issue 自动 close · 或 worker 手 close

          ---
          *Auto-opened by .github/workflows/daily-visual.yml admin-e2e job · ROI #5 evidence chain*
          EOF
          )

          EXISTING=$(gh issue list \
            --repo "${REPO}" \
            --label admin-e2e \
            --state open \
            --search "${TITLE}" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} 已存在 · 追加 comment"
            gh issue comment "$EXISTING" \
              --repo "${REPO}" \
              --body "重复 fail · run #${RUN_ID} · ${DATE}"
          else
            gh issue create \
              --repo "${REPO}" \
              --title "$TITLE" \
              --body "$BODY" \
              --label admin-e2e,regression
          fi
