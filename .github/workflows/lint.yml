name: Lint (docx residue + schema v1.1 + CSS universal override)

# Liu Ye D Phase 5 retroactive 防御 · 2026-05-21
#
# 触发条件 (path-scoped · 只在相关文件变动时跑 · 不浪费 actions runner):
#   - samples/**/*.docx · samples/**/*.metadata.json (docx residue lint)
#   - templates/placeholder-schema.json             (schema v1.1 health)
#   - web/src/app/archive/**/*.{css,tsx}            (CSS v1/v2 cover)
#   - scripts/lint/liuye_*.py · scripts/lint/css_*.sh (lint script 自身改动)
#
# 与现有 workflow 区分:
#   - lint-contracts.yml  · agent naming SSOT + letterpress purge (Phase A)
#   - baseline-gate.yml   · 6 agent evaluation runner (默认 disabled)
#   - daily-visual.yml    · 视觉回归
#   - fix-forward-budget.yml · D 阶段预算
#   - web-audit.yml       · web 工程审计
#   - lint.yml (本文件)   · D Phase 5 lint 三件套
#
# Job 拆分:
#   3 个 lint 独立 job · 并行跑 · 任一 fail 阻塞 PR (continue-on-error: false)
#   独立 job 好处: 拆 log 清晰 · 失败定位快 · runner 不共享 state
#
# 来源 commits:
#   - 22bc76f · scripts/lint/liuye_docx_residue_check.py
#   - 10fa2bb · scripts/lint/liuye_schema_v1_1_check.py
#   - 22b7653 · scripts/lint/css_universal_override_check.sh

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
    paths:
      - 'samples/**/*.docx'
      - 'samples/**/*.metadata.json'
      - 'templates/placeholder-schema.json'
      - 'web/src/app/archive/**/*.css'
      - 'web/src/app/archive/**/*.tsx'
      - 'scripts/lint/liuye_docx_residue_check.py'
      - 'scripts/lint/liuye_schema_v1_1_check.py'
      - 'scripts/lint/css_universal_override_check.sh'
      - 'v16_step1_extract.py'
      - '.github/workflows/lint.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'samples/**/*.docx'
      - 'samples/**/*.metadata.json'
      - 'templates/placeholder-schema.json'
      - 'web/src/app/archive/**/*.css'
      - 'web/src/app/archive/**/*.tsx'
      - 'scripts/lint/liuye_docx_residue_check.py'
      - 'scripts/lint/liuye_schema_v1_1_check.py'
      - 'scripts/lint/css_universal_override_check.sh'
      - 'v16_step1_extract.py'
      - '.github/workflows/lint.yml'

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1 · Docx placeholder residue (byte-level diff)
  # 阻断: HIGH > 0 OR MED > 0 (LOW pattern 兜底 · 仅警告)
  # ────────────────────────────────────────────────────────────────────
  docx-residue:
    name: Docx placeholder residue (byte-level diff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install python-docx

      - name: Run docx residue lint (JSON output for artifact)
        id: lint
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/lint/liuye_docx_residue_check.py --json > docx-residue-report.json
          # 文本版同时输出到 console · 给 PR review 看
          python scripts/lint/liuye_docx_residue_check.py
        continue-on-error: false

      - name: Upload residue report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-residue-report-${{ github.sha }}
          path: docx-residue-report.json
          retention-days: 14

      - name: Show failure context (PR review visibility)
        if: failure()
        run: |
          echo "=== Docx residue lint FAILED (D Phase 5 防御) ==="
          echo ""
          echo "阻断阈值: HIGH > 0 OR MED > 0"
          echo "  - HIGH = declared placeholder_locations 但 cur 没占位符 · 或 canonical 字面在 cur+orig 同位置"
          echo "  - MED  = canonical 字面在 cur 出现 · 但 orig 同位置无 (新引入 leak)"
          echo "  - LOW  = backup pattern 兜底 (公司名/人名/资金/日期/身份证/USCC) · 仅警告"
          echo ""
          echo "修复路径:"
          echo "  1. 看 artifact docx-residue-report.json 找 HIGH/MED location"
          echo "  2. v16_placeholderize_jingwei_phase4.py 加对应 location 的 placeholder rule"
          echo "  3. 重跑 placeholder pipeline · 再跑 lint 确认 HIGH=0 MED=0"
          echo ""
          echo "原料: commit 22bc76f · scripts/lint/liuye_docx_residue_check.py"

  # ────────────────────────────────────────────────────────────────────
  # Job 2 · Schema v1.1 health (C1-C6 硬规则)
  # 阻断: 任一 C1-C6 检查未过
  # ────────────────────────────────────────────────────────────────────
  schema-health:
    name: Schema v1.1 health (placeholder-schema.json)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run schema lint
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/lint/liuye_schema_v1_1_check.py --json > schema-lint-report.json
          # 文本版同时输出 · 给 PR review 看
          python scripts/lint/liuye_schema_v1_1_check.py
        continue-on-error: false

      - name: Upload schema lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-lint-report-${{ github.sha }}
          path: schema-lint-report.json
          retention-days: 14

      - name: Show failure context
        if: failure()
        run: |
          echo "=== Schema v1.1 lint FAILED ==="
          echo ""
          echo "6 项硬规则:"
          echo "  C1 · schema_version 字段存在 + 格式 N.N(.N)"
          echo "  C2 · changelog 至少 1 entry"
          echo "  C3 · 每个 field 有 scope_tag ∈ {retail, corporate, both}"
          echo "  C4 · enum field 必有非空 enum_values"
          echo "  C5 · key 命名 ^[A-Z][A-Z0-9_]+$"
          echo "  C6 · v1.0 baseline 34 字段不可删 (向后兼容)"
          echo ""
          echo "原料: commit 10fa2bb · scripts/lint/liuye_schema_v1_1_check.py"

  # ────────────────────────────────────────────────────────────────────
  # Job 3 · CSS universal override v1/v2 cover
  # 阻断: workspace 用 v1 但 idle-tight 只 cover v2 (反之同理)
  # ────────────────────────────────────────────────────────────────────
  css-universal-override:
    name: CSS universal override v1/v2 cover
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CSS lint
        run: bash scripts/lint/css_universal_override_check.sh
        continue-on-error: false

      - name: Show failure context
        if: failure()
        run: |
          echo "=== CSS universal override lint FAILED ==="
          echo ""
          echo "report/channel 用 v1 (rpt-body/rpt-main/rpt-side/rpt-aux)"
          echo "credit/alert/compliance 用 v2 (rpt-grid/rpt-col--mid/rpt-col--left/rpt-col--right)"
          echo "idle-tight.css universal override 必须同时 cover v1 + v2 alias"
          echo ""
          echo "修复: idle-tight.css 任何 .v-archive--canon .<v2-selector> 同时加 .<v1-alias>"
          echo "见 docs/contracts/css-naming-ssot.md"
          echo ""
          echo "原料: commit 22b7653 · scripts/lint/css_universal_override_check.sh"
