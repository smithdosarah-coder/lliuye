name: lint-contracts

# 6 Agent 命名 SSOT 一致性校验 (Phase A 验收硬线 #8)
# Spec: docs/contracts/agent-naming-ssot.md v1.0 §4
# Script: scripts/lint/check_agent_naming_ssot.py
#
# 现状: PM 待拍板 compli vs compliance 单 id (SSOT §3) · lint 跑非 --strict 模式
#       · 双 id 状态报 WARN 不阻 merge · PM 拍板后改 strict (yml 改 `--strict`)。

on:
  push:
    branches:
      - main
      - chore/l0-infra
      - 'feat/**'
      - 'chore/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - chore/l0-infra

jobs:
  agent-naming-ssot:
    name: agent-naming-ssot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run agent-naming SSOT lint
        run: |
          python scripts/lint/check_agent_naming_ssot.py

      - name: JSON output (for log artifact)
        if: always()
        run: |
          python scripts/lint/check_agent_naming_ssot.py --json > ssot-lint-report.json || true
          cat ssot-lint-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssot-lint-report
          path: ssot-lint-report.json
          retention-days: 14
