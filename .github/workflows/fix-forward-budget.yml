name: Fix-Forward Budget Gate (ROI #3)

# Codex R1 修正版 ROI #3 · 5/10 §病灶 #2 fix-forward 失控防御.
# 历史背景:
#   - 5/10 retro: 14 天 109/733 ≈ 14.9% fix commit
#   - 5/21 follow-up: 11 天 173/255 ≈ 67.8% fix commit (飙升 4.5 倍)
#   - 没有自动限流 = 项目持续救火无停手机制
#
# 本 workflow 设阈值告警/阻断 PR, 防再失控.
#
# 阈值 (按 5/10 复盘 + codex R1 推荐):
#   - 最近 N=50 commits fix 占比 > 30% -> warning
#   - > 50% -> FAIL (block PR merge)
#
# 例外 label (绕过 gate, 需要 reviewer 显式加):
#   - fix-forward-approved: 已经走 freeze + retro 流程, 这个 PR 是 stop-the-line
#   - hotfix-emergency: 真生产 P0, 不走标准 budget
#
# 见: docs/contracts/fix-forward-budget-policy.md

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      window:
        description: "Commit window size (default 50)"
        required: false
        default: "50"

jobs:
  fix-ratio-gate:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.pull_request.labels.*.name, 'fix-forward-approved') &&
      !contains(github.event.pull_request.labels.*.name, 'hotfix-emergency')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100  # 够算 last 50 commits

      - name: Compute fix ratio in recent commits
        id: ratio
        run: |
          WINDOW="${{ github.event.inputs.window || '50' }}"
          TOTAL=$(git log -${WINDOW} --format=%s 2>/dev/null | wc -l)
          if [ "$TOTAL" -lt 10 ]; then
            echo "::warning::Commit window too small ($TOTAL), skipping gate"
            echo "ratio=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Match patterns: "fix:" / "fix(" / "hotfix" / 中文 "修复" / "revert"
          # 不 match: "feat: ... fixes a bug" (那是 feat 不算 fix-forward)
          FIX=$(git log -${WINDOW} --format=%s 2>/dev/null | grep -ciE "^(fix|hotfix|revert)[:( ]|修复" || echo 0)

          # bash float arithmetic via awk
          RATIO=$(awk "BEGIN { printf \"%.1f\", ($FIX/$TOTAL)*100 }")
          echo "Last $TOTAL commits: $FIX are fix/hotfix/revert = $RATIO%"
          echo "ratio=$RATIO" >> $GITHUB_OUTPUT
          echo "window=$TOTAL" >> $GITHUB_OUTPUT
          echo "fix_count=$FIX" >> $GITHUB_OUTPUT

      - name: Gate check
        run: |
          RATIO="${{ steps.ratio.outputs.ratio }}"
          WINDOW="${{ steps.ratio.outputs.window }}"
          FIX="${{ steps.ratio.outputs.fix_count }}"

          # awk 比较因为 bash 不支持 float
          fail_threshold=$(awk "BEGIN { print ($RATIO > 50) }")
          warn_threshold=$(awk "BEGIN { print ($RATIO > 30) }")

          echo "=== Fix-Forward Budget Status ==="
          echo "Window: last $WINDOW commits"
          echo "Fix/hotfix/revert: $FIX ($RATIO%)"
          echo ""

          if [ "$fail_threshold" = "1" ]; then
            cat <<EOF
          ::error file=.github/workflows/fix-forward-budget.yml::FIX RATIO EXCEEDED HARD LIMIT

          Last $WINDOW commits have $FIX fix/hotfix/revert ($RATIO% > 50%).
          This is fix-forward failure mode - project is in continuous firefighting.

          Required actions (codex R1 修正版 ROI #3):
          1. STOP shipping new features
          2. Run retro to identify root cause categories
          3. Address top 2 categories before resuming feature work
          4. To bypass this gate for genuine P0 hotfix:
             - Apply label 'hotfix-emergency' (requires reviewer approval)
             - Or 'fix-forward-approved' (after retro is complete)

          See: docs/contracts/fix-forward-budget-policy.md
          EOF
            exit 1
          elif [ "$warn_threshold" = "1" ]; then
            cat <<EOF
          ::warning file=.github/workflows/fix-forward-budget.yml::Fix ratio warning ($RATIO%)

          Last $WINDOW commits have $FIX fix/hotfix/revert ($RATIO% > 30%).
          Monitor trend - if it crosses 50% the gate will block.

          Consider preventive retro before threshold reached.
          EOF
          else
            echo "::notice::Fix ratio $RATIO% within budget ($WINDOW window)"
          fi

      - name: Comment PR on warning/fail
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          (steps.ratio.outputs.ratio > 30)
        uses: actions/github-script@v7
        with:
          script: |
            const ratio = '${{ steps.ratio.outputs.ratio }}';
            const window = '${{ steps.ratio.outputs.window }}';
            const fix = '${{ steps.ratio.outputs.fix_count }}';
            const failed = parseFloat(ratio) > 50;
            const emoji = failed ? '🔴' : '🟡';
            const status = failed ? 'FAILED' : 'WARN';
            const body = `${emoji} **Fix-Forward Budget ${status}**

            - Window: last ${window} commits
            - Fix/hotfix/revert: ${fix} (**${ratio}%**)
            - Threshold: 30% warn / 50% fail

            ${failed
              ? `### This PR is blocked

            Project is in fix-forward failure mode (>50% fix commits). Required:
            1. Stop new feature work
            2. Run retro
            3. Apply \`fix-forward-approved\` label after retro complete, or
            4. Apply \`hotfix-emergency\` for genuine P0 (needs reviewer approval)

            See: \`docs/contracts/fix-forward-budget-policy.md\``
              : `Within warning band. Monitor and plan retro if trending up.`
            }`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Open retro Issue on FAIL
        if: |
          failure() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const ratio = '${{ steps.ratio.outputs.ratio }}';
            const window = '${{ steps.ratio.outputs.window }}';
            const fix = '${{ steps.ratio.outputs.fix_count }}';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const commitSha = '${{ github.sha }}';
            const shortSha = commitSha.substring(0, 7);
            const today = new Date().toISOString().split('T')[0];

            // 拿最近 N=50 commits message list 给 retro template
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'main',
              per_page: 50,
            });
            const fixCommits = commits.filter(c =>
              /^(fix|hotfix|revert)[:( ]|修复/i.test(c.commit.message)
            );
            const fixList = fixCommits.slice(0, 20).map(c =>
              `- ${c.sha.substring(0, 7)} ${c.commit.message.split('\n')[0]}`
            ).join('\n');

            const body = [
              '## 🔴 Fix-Forward Budget EXCEEDED · Retro Required',
              '',
              '### 数据快照',
              `- Window: 最近 ${window} commits`,
              `- Fix/hotfix/revert: ${fix} (${ratio}%)`,
              `- 触发 CI run: ${runUrl}`,
              `- 触发 commit: ${shortSha}`,
              '- 阈值: > 50% FAIL · 已 STOP THE LINE',
              '',
              '### 触发本 retro 的 Top 20 fix commits',
              fixList || '_(无法拉取 commit list · 见 CI run 日志)_',
              '',
              '### Retro 流程（per docs/contracts/fix-forward-budget-policy.md §4）',
              '',
              '#### Step 1 · Stop the line（< 1 天）',
              '- [ ] PM 在 #liuye-mesh 发 freeze announcement',
              '- [ ] 所有 worker / contributor 暂停 feature 工作',
              '- [ ] 当前 in-flight PRs 不强删 · 但 **新 PR 暂停 merge**（除 `hotfix-emergency` label）',
              '',
              '#### Step 2 · Retro（1-2 天）',
              '- [ ] 收集最近 50 commits 全列表（见上）',
              '- [ ] 按根因分类（参考 5/10 retro §2 5 个病灶）',
              '- [ ] 找 top 2 类根因 · 确定 owner + due date',
              `- [ ] 沉淀到 \`docs/handoff/retro-${today}.md\``,
              '',
              '#### Step 3 · Apply fixes（1-3 天）',
              '- [ ] 写防御 patch（每 PR 加 `fix-forward-approved` label）',
              '- [ ] Merge 后跑 ratio 检查命令（见下）看新 ratio',
              '',
              '#### Step 4 · Resume',
              '- [ ] Ratio 降到 ≤ 30% 触发 unfreeze',
              '- [ ] 沉淀经验到 `docs/contracts/` 防再坑',
              '',
              '### 配套',
              '- [policy doc](../blob/main/docs/contracts/fix-forward-budget-policy.md)',
              '- 5/10 retro reference (wiki): `2026-05-21-产品矩阵-status-vs-510-retro`',
              '',
              '### 关闭本 Issue 条件',
              '',
              '跑：',
              '```bash',
              `git log -50 --format=%s | awk 'BEGIN{f=0;t=0} {t++; if ($0 ~ /^(fix|hotfix|revert)[:( ]/ || $0 ~ /修复/) f++} END{printf "ratio: %.1f%%\\n", (f/t)*100}'`,
              '```',
              '',
              'ratio < 30% 关 Issue · 反之保持 open',
              '',
              '---',
              '',
              `🤖 Auto-opened by fix-forward-budget.yml on ${shortSha}`,
            ].join('\n');

            // Check if Issue 已存在 (同 label · 不重开)
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fix-forward-retro',
            });

            if (existing.length > 0) {
              // 评论已有 Issue · 不重开
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `**重复触发** · 新 commit ${shortSha} 仍 fail (ratio ${ratio}%)\n\n${body}`,
              });
              core.info(`Commented on existing retro Issue #${existing[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 Fix-Forward Budget Retro Required · ${today} · ratio ${ratio}%`,
                body: body,
                labels: ['fix-forward-retro', 'p0-incident', 'stop-the-line'],
              });
              core.info(`Opened retro Issue #${created.number}`);
            }
