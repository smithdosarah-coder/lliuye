    unfilled_count: 32
    total_filled: 460
    unfilled_marker_accuracy: 1.0000  # Phase A `94c04f5` 锚点 · per pending_reason 末注

  # A-013 对齐:声明本期暂未跑批的 metric 名,runner 应在 _verdict 中跳过这些指标的判定;
