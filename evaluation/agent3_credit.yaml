# Agent3 授信决策 评估配置
# schema: A-025 · 双字段（老 desc/target 保留 + 新 description/method/baseline_target/blocker_threshold）
agent: credit
version: v3.1
updated: 2026-04-24

metrics:
  common:
    - name: field_completeness
      desc: ReportJSON 结构化字段填充率（基本信息/财务/授信/征信 4 段）
      description: ReportJSON 结构化字段填充率（基本信息/财务/授信/征信 4 段）
      method: filled_fields_total / expected_fields_total
      target: ">= 0.90"
      baseline_target: 0.90
      blocker_threshold: 0.70

    - name: task_completion_rate
      desc: ReportJSON 输入能否产出四维评分 + 决策建议
      description: ReportJSON 输入到四维评分 + 决策建议全流程产出率
      method: runs_with_full_scoring / runs_total
      target: ">= 0.98"
      baseline_target: 0.98
      blocker_threshold: 0.85

    - name: evidence_rate
      desc: 评分 / 建议每条回指证据（财务项 / 征信项 / 同业案例）
      description: 评分/决策建议回指证据（财务/征信/案例）的条目占比
      method: items_with_evidence / items_total
      target: ">= 0.95"
      baseline_target: 0.95
      blocker_threshold: 0.80

    - name: hallucination_rate
      desc: 决策建议中出现原始材料不存在的数字或事实
      description: 决策建议中引用原始 ReportJSON 未出现的数字/事实 占比
      method: ungrounded_claims / total_claims
      target: "<= 0.01"
      baseline_target: 0.01
      blocker_threshold: 0.05

    - name: tool_success_rate
      desc: 评分 / 红线 / 案例召回工具调用正确率
      description: 评分/红线/案例召回工具调用 success/total
      method: tool_calls_success / tool_calls_total
      target: ">= 0.95"
      baseline_target: 0.95
      blocker_threshold: 0.80

  domain:
    - name: ratio_calc_consistency
      desc: 财务比率与 financial_analyzer Python 计算一致率
      description: Agent3 输出财务比率（流动比率/资产负债率/ROE 等）与 financial_analyzer 确定性计算结果一致（绝对差 < 0.005）的比例
      method: agree_ratios / total_ratios  (|delta|<0.005)
      target: ">= 0.99"
      baseline_target: 0.99
      blocker_threshold: 0.95

    - name: redline_detection_accuracy
      desc: 红线触发识别准确率（对比人工标注）
      description: 红线触发识别 precision × recall 下的 F1（对比人工标注真值集）
      method: f1_over_manual_redline_annotations
      target: ">= 0.95"
      baseline_target: 0.95
      blocker_threshold: 0.80

    - name: score_human_agreement
      desc: 四维评分与人工复核的一致率（差 ≤ 1 分）
      description: 四维评分（财务/征信/经营/风险）与人工复核每维差 ≤ 1 分的比例
      method: dims_with_delta_leq_1 / dims_total (4 dims × N cases)
      target: ">= 0.85"
      baseline_target: 0.85
      blocker_threshold: 0.65

    - name: credit_limit_reasonability
      desc: 额度建议与终审实际批复的偏差中位数
      description: 额度建议相对终审批复的对数偏差中位数 |log10(rec/actual)|
      method: median_abs_log10_ratio(recommended, actual)
      target: "<= 0.20"
      baseline_target: 0.20
      blocker_threshold: 0.40

    - name: terminology_compliance
      desc: 信贷业务术语规范率（对比审贷标准用语表）
      description: 信贷业务术语合规率（对比众安/监管标准用语表 v1.0）
      method: compliant_terms / terms_total_detected
      target: ">= 0.90"
      baseline_target: 0.90
      blocker_threshold: 0.75

baseline:
  last_run: null
  commit: null
