# Agent1 个人画像 (BE12 personal_insight 子域) 评估配置
# Sprint 3 BE13 POC · 4 维度评价 (per phase-b-charter v2 line 175 · post-Codex re-review V2 修正 ·
# 替代旧"经营策略 20%"维度名 per BE12 schema 实际维度)
# schema: A-025 双字段 · weight 字段编码 4 维度权重 (35/25/20/20 · 加权和 100%)
# 锚定 schema: agent_channel/personal_insight.py @ 9479428 · PersonalInsightPayload TypedDict
# PREP-ONLY: BE12 真业务 ship (LLM grounded + sources + redact) 后再启用 runner --agent personal_insight
agent: personal_insight
version: v0.1-prep
updated: 2026-05-05
description: |
  BE13 POC 4 维度加权评价配置 · 配套 agent_channel/personal_insight.py BE12 子域。
  当前 BE12 仅 ship schema + stub (commit 9479428) · runner adapter 已 scaffold ·
  BE12 真业务 (LLM grounded talking_points + compliance sources + PII redact) ship 后启用。

  4 维度权重 (per BE13 brief · POC-4-DIMS):
    person_features_accuracy        35%   # 个人画像准确度 (PersonFeatures 6 字段)
    product_fit_score               25%   # 产品适配度 (ProductFit.fit_score + 推荐有效性)
    compliance_talkpoints_completeness  20%  # 合规+话术 (ComplianceCheck + TalkingPoints)
    pii_latency_compliance          20%   # PII redaction 强制 + latency 性能
  加权 4-dim 综合分 (POC verdict): weighted_sum / 100 → PASS ≥ 0.85 · PARTIAL [0.70, 0.85) · FAIL < 0.70

metrics:
  common:
    - name: field_completeness
      desc: PersonalInsightPayload 7 顶层字段 (candidate_id/person_features/product_fit/compliance_check/talking_points/pii_redacted/latency_ms) 填充率
      description: 7 顶层 schema 字段非空 / non-stub 占比
      method: filled_top_level_fields / 7
      target: ">= 0.95"
      baseline_target: 0.95
      blocker_threshold: 0.80

    - name: evidence_rate
      desc: talking_points / compliance_check 引证带来源 (sources) 的占比
      description: compliance_check.sources 非空 + talking_points.objection_responses 含证据 · 占比
      method: items_with_sources / items_total
      target: ">= 0.90"
      baseline_target: 0.90
      blocker_threshold: 0.70

    - name: hallucination_rate
      desc: recommended_products / compliance flags 不可解析 (产品 SKU 不存在 / flag 不在合规字典) 占比
      description: 不可在产品目录 + 合规标签字典 找到的占比
      method: unresolvable_items / items_total
      target: "<= 0.02"
      baseline_target: 0.02
      blocker_threshold: 0.05

    - name: tool_success_rate
      desc: shared/llm_caller fallback chain 调用成功率 (deepseek 主 + dashscope 备 · per CLAUDE.md §3.6 + §3.7.3)
      description: LLM call 成功率 (含 fallback 后成功) · 走 shared/llm_caller 唯一入口
      method: llm_calls_success / llm_calls_total
      target: ">= 0.95"
      baseline_target: 0.95
      blocker_threshold: 0.80

    - name: task_completion_rate
      desc: GET /api/channel/personal_insight/{candidate_id} 端到端 200 OK 占比 (含 PersonalInsightPayload schema valid)
      description: endpoint 200 OK + 7 顶层字段 schema valid 占比
      method: runs_200_with_valid_schema / runs_total
      target: ">= 0.95"
      baseline_target: 0.95
      blocker_threshold: 0.75

  domain:
    # ============================================================
    # 维度 1 · 个人画像 (person_features) 准确度 · 权重 35%
    # ============================================================
    - name: person_features_accuracy
      weight: 0.35
      desc: PersonFeatures 6 字段 (role/industry_yr/education/age_range/risk_appetite/decision_path) 非"未能自动填写"占比 + (oracle 到位时) 与 gold 重合度
      description: |
        组合分 (deterministic 70% + oracle 30%):
        - filled_ratio = filled_fields / 6  (字段非占位的占比)
        - oracle_match = match_with_gold / 6 (gold person_features oracle 到位时计算 · 否则 NaN)
        - score = filled_ratio * 0.7 + oracle_match * 0.3 (oracle 缺失时 score = filled_ratio)
      method: deterministic_filled_ratio_70pct + oracle_match_30pct
      target: ">= 0.85"
      baseline_target: 0.85
      blocker_threshold: 0.70

    # ============================================================
    # 维度 2 · 产品适配 (product_fit) · 权重 25%
    # ============================================================
    - name: product_fit_score
      weight: 0.25
      desc: ProductFit.fit_score / 100 + recommended_products 数量 ≥ 1 + fit_reasons 至少 1 条
      description: |
        组合分 (deterministic):
        - normalized_fit = fit_score / 100  (0-100 归一化到 0-1)
        - has_recommend = 1.0 if len(recommended_products) >= 1 else 0.0
        - has_reason = 1.0 if len(fit_reasons) >= 1 else 0.0
        - score = normalized_fit * 0.6 + has_recommend * 0.2 + has_reason * 0.2
      method: deterministic_weighted_avg
      target: ">= 0.75"
      baseline_target: 0.75
      blocker_threshold: 0.60

    # ============================================================
    # 维度 3 · 合规 + 话术 (compliance_check + talking_points) · 权重 20%
    # 替代旧"经营策略 20%"维度 (per Codex re-review V2 修正 · BE12 schema 实际维度)
    # ============================================================
    - name: compliance_talkpoints_completeness
      weight: 0.20
      desc: |
        compliance_check.aml_risk 非"未知" + sources 至少 1 + last_checked 非空
        + talking_points.opener / closing 非占位 + key_messages ≥ 1 + objection_responses ≥ 1
      description: |
        组合分 (deterministic 8 子项 · compliance 3 + talking 5):
        - compliance 3 子项: aml_risk_known(0.15) + sources_ge1(0.15) + last_checked_set(0.10) = 0.40
        - talking 5 子项: opener_set(0.10) + closing_set(0.10) + key_messages_ge1(0.10) + objections_ge1(0.10) + opener_no_placeholder(0.10) = 0.50
        - 注: 合规 0.40 + 话术 0.50 = 0.90 + 缓冲 0.10 (留 BE12 真业务后扩展)
        - score = sum(子项命中权重) · 与 adapter 实现 8 子项一致 (per Codex review V2 修正)
      method: deterministic_8sub_weighted
      target: ">= 0.80"
      baseline_target: 0.80
      blocker_threshold: 0.65

    # ============================================================
    # 维度 4 · PII redaction + latency · 权重 20%
    # ============================================================
    - name: pii_latency_compliance
      weight: 0.20
      desc: |
        pii_redacted=True 强制 (per CLAUDE.md §3.7.5 PII never-plain 守 BE7 ledger 上链前提)
        + latency_ms ≤ P95 budget 5000ms (per BE12 性能维度)
      description: |
        组合分 (deterministic 2 子项 · 强制 PII gate):
        - pii_gate: 1.0 if pii_redacted=True else 0.0  (强制 · False 直接整个维度 0 分)
        - latency_score: 1.0 if latency_ms <= 5000 · 0.7 if 5000-10000 · 0.3 if 10000-30000 · 0.0 if > 30000
        - score = pii_gate * (0.5 + latency_score * 0.5)  (PII 必通 · latency 软分)
      method: deterministic_pii_gate_x_latency_score
      target: ">= 0.85"
      baseline_target: 0.85
      blocker_threshold: 0.50

baseline:
  last_run: null
  commit: null
  pending_metrics:
    # BE12 真业务未 ship · 全 4 维 + 5 common 都 SKIP · adapter scaffold 已 ship 等接通
    - field_completeness
    - evidence_rate
    - hallucination_rate
    - tool_success_rate
    - task_completion_rate
    - person_features_accuracy
    - product_fit_score
    - compliance_talkpoints_completeness
    - pii_latency_compliance

# ============================================================
# 反 5 原则 §3.5 自检 (POC 数据约束)
# ============================================================
# 1. 盲测           : oracle gold 由 PM 设计 · adapter (worker) 不预知 · 跑后对比
# 2. 难度分层       : oracle 候选含简单 20% / 中等 50% / 困难 20% / 极端 10%
# 3. 真实来源锚定   : 参考 A 股年报董监高 / 央行小微问卷 / 银保监投诉公告真实形态
# 4. 脱敏再造       : 不直接用真实存续企业 · 改名改数字保量级
# 5. 环境边界       : person_features 内部稳态 context (data/personal_insight_kb/)
